# Reverse proxy in front of the Go API (src/main.go listens on :8000).
# Mounted at /etc/nginx/nginx.conf — this is a complete config, not a conf.d snippet.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # -------------------------------------------------------------------------
    # Logging

    log_format json_combined escape=json
        '{'
          '"time":"$time_iso8601",'
          '"request_id":"$request_id",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"body_bytes":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_response_time":"$upstream_response_time",'
          '"referrer":"$http_referer",'
          '"user_agent":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    # -------------------------------------------------------------------------
    # Core

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout   65;
    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # -------------------------------------------------------------------------
    # Compression

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        application/json application/problem+json text/plain text/css application/javascript;

    # -------------------------------------------------------------------------
    # Abuse control. Writes are cheaper to protect here than in the app, so they
    # get their own tighter bucket. A limit_req zone with an empty key is a
    # no-op, which is how each request lands in exactly one of the two zones.

    map $request_method $read_key {
        default  $binary_remote_addr;
        POST     "";
        PUT      "";
        PATCH    "";
        DELETE   "";
    }

    map $request_method $write_key {
        default  "";
        POST     $binary_remote_addr;
        PUT      $binary_remote_addr;
        PATCH    $binary_remote_addr;
        DELETE   $binary_remote_addr;
    }

    limit_req_zone  $read_key  zone=api_read:10m  rate=30r/s;
    limit_req_zone  $write_key zone=api_write:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Upstream

    upstream api_backend {
        server api:8000 max_fails=3 fail_timeout=10s;

        keepalive          32;
        keepalive_timeout  60s;
    }

    # Reuse the caller's X-Request-ID when present, otherwise mint one, so a
    # request can be traced from nginx into the API log lines.
    map $http_x_request_id $trace_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    server {
        listen       80;
        server_name  _;

        # Kept short of the API's own ReadTimeout/WriteTimeout (5s/10s) plus slack.
        proxy_connect_timeout  5s;
        proxy_send_timeout     15s;
        proxy_read_timeout     15s;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Request-ID      $trace_id;
        add_header         X-Request-ID      $trace_id always;

        proxy_buffering        on;
        proxy_request_buffering on;

        # CORS is owned by the API (mid.Cors) — nginx must not add its own
        # Access-Control-* headers or the browser sees duplicates.

        # Proxy health, not app health: answered by nginx itself.
        location = /healthz {
            access_log off;
            return 200 '{"success":true,"data":{"status":"ok"}}';
        }

        location /api/v1/ {
            limit_conn api_conn 32;

            limit_req zone=api_read  burst=60 nodelay;
            limit_req zone=api_write burst=20 nodelay;

            proxy_pass http://api_backend;

            # Retry the next upstream only for requests that never reached it.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location / {
            return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"route not found"}}';
        }

        # Keep nginx-generated failures in the API's response envelope.
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @upstream_down;

        location @rate_limited {
            return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"rate limit exceeded, slow down"}}';
        }

        location @upstream_down {
            return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"upstream api is unavailable"}}';
        }
    }
}
