name: agnos-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: agnos_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agnos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agnos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - agnos

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agnos_api
    # The app reads config through viper with AutomaticEnv, so db.user -> DB_USER.
    # config.yaml is not baked into the image; these vars are the whole config.
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres:5432
      DB_NAME: ${DB_NAME:-agnos}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_DISABLE_TLS: ${DB_DISABLE_TLS:-true}
      # Space-separated: viper casts an env string to a slice on whitespace.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GIN_MODE: ${GIN_MODE:-release}
    # Binary name comes from the Dockerfile build step (-o backend).
    command: ["./backend", "--migration=true"]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null 'http://127.0.0.1:8000/api/v1/hospital?page=1&limit=1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - agnos

  nginx:
    image: nginx:1.27-alpine
    container_name: agnos_nginx
    # Published on 8000 so docs/api-spec.md's base URL keeps working:
    # http://localhost:8000/api/v1
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - agnos

volumes:
  pgdata:

networks:
  agnos:
    driver: bridge
